# Lefthook and the JS tooling live in vite-src, not in the repository root.
lefthook: node vite-src/node_modules/lefthook/bin/index.js

pre-commit:
  commands:
    format:
      root: vite-src/
      glob: "*.{js,jsx,ts,tsx,json,css,md}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    lint:
      root: vite-src/
      glob: "*.{js,jsx,ts,tsx}"
      run: npm run lint
    typecheck:
      root: vite-src/
      glob: "*.{ts,tsx}"
      run: npm run typecheck
